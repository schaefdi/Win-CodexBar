name: Security audit

on:
  push:
    branches:
      - main
      - agent/repo-health-audit-20260710
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  locked-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit locked Rust dependencies
        run: cargo audit --file Cargo.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop-tauri install --frozen-lockfile
      - name: Audit frontend production dependencies
        run: pnpm --dir apps/desktop-tauri audit --prod --audit-level high
