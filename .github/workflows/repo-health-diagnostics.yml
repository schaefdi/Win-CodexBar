name: Rust dependency diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture vulnerable dependency ownership
        run: |
          cargo tree -i quick-xml > quick-xml-tree.txt
          cargo tree -i quinn-proto > quinn-proto-tree.txt
      - name: Capture upgrade constraints
        run: |
          (cargo update -p quick-xml --precise 0.41.0 || true) > quick-xml-update.txt 2>&1
          git checkout -- Cargo.lock
          (cargo update -p quinn-proto --precise 0.11.15 || true) > quinn-proto-update.txt 2>&1
          git checkout -- Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: win-codexbar-dependency-constraints
          path: |
            quick-xml-tree.txt
            quinn-proto-tree.txt
            quick-xml-update.txt
            quinn-proto-update.txt
          if-no-files-found: error
